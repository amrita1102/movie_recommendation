name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:

  test:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: .
      MYSQL_HOST: localhost
      MYSQL_PORT: 3306
      MYSQL_DATABASE: movie_db
      MYSQL_USER: movie_user
      MYSQL_PASSWORD: movie_password

    services:

      redis:
        image: redis:7

        ports:
          - 6379:6379

        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mysql:
        image: mysql:8.4

        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: movie_db
          MYSQL_USER: movie_user
          MYSQL_PASSWORD: movie_password

        ports:
          - 3306:3306

        options: >-
          --health-cmd "mysqladmin ping -h localhost -u root -prootpassword"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Initialize database
        run: |
          python -m scripts.init_db

      - name: Import movies
        run: |
          python -m scripts.import_movies

      - name: Import history
        run: |
          python -m scripts.import_history

      - name: Run tests
        run: |
          pytest -v