version: "3.9"

services:

  redis:

    image: redis

    ports:
      - "6379:6379"

  fastapi:

    build: .

    ports:
      - "8000:8000"

    depends_on:
      - redis

    environment:
      REDIS_HOST: redis

  prometheus:

    image: prom/prometheus

    container_name: prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

    depends_on:
      - fastapi

  grafana:

    image: grafana/grafana

    container_name: grafana

    ports:
      - "3000:3000"

    depends_on:
      - prometheus

    volumes:
      - grafana-data:/var/lib/grafana

volumes:

  grafana-data:
